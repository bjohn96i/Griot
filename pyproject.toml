[project]
name = "griot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "textual>=0.80",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Gapless looping for the Dataterm drive (AVAudioPlayer.numberOfLoops = -1).
    # macOS-only; elsewhere griot.sound falls back to afplay, which seams.
    'pyobjc-framework-AVFoundation>=10.0 ; sys_platform == "darwin"',
]

[project.scripts]
griot-tasks = "griot.tasks.app:main"
griot-status = "griot.status.app:main"
griot-theme = "griot.theme:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
