[project]
name = "griot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["textual>=0.80", "pyyaml>=6.0", "httpx>=0.27"]

[project.scripts]
griot-tasks = "griot.tasks.app:main"
griot-status = "griot.status.app:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
