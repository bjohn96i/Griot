# griot-center: the tab bar session. Runs on its own socket (-L griot).
set -g mouse on
set -g status on
set -g status-position top
set -g status-justify left
set -g status-left ""
set -g status-right "#[fg=#E3B341] ⌥t new · ⌥w close "
set -g status-style "bg=#000000,fg=#8FA3C7"
set -g window-status-format "#[fg=#8FA3C7,bg=#0D1526]  #I #W  "
set -g window-status-current-format "#[fg=#000000,bg=#E3B341,bold]  #I #W  "
set -g window-status-separator ""
set -g pane-border-style "fg=#1E3A5F"
set -g pane-active-border-style "fg=#1E3A5F"
set -g base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -g history-limit 50000
# Keep explicit window names (first tab "griot", note/claude tabs named on
# creation); don't let tmux/the running program rewrite them to "zsh"/"node".
set -g automatic-rename off
set -g allow-rename off

# Tab keys — Alt/Option (no prefix). Terminal must send Option as Meta/Esc+.
bind -n M-t new-window -c "#{@claude_dir}" -n claude "claude"
# Command palette (⌥x) and quick-capture (⌥c) — global popups (griot-* on PATH).
bind -n M-x display-popup -E -w 70% -h 60% "griot-palette"
bind -n M-c display-popup -E -w 60% -h 30% "griot-capture"
bind -n M-w confirm-before -p "close tab #W? (y/n)" kill-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
